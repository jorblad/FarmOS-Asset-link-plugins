name: E2E

# Playwright end-to-end suite against a real farmOS instance (the same
# jorblad/farmos-k8s image used for local development). Runs on x86 runners
# where farmOS executes natively (no emulation), so bring-up is quick.
#
# Scope:
#   - api.farmos.spec.js  : JSON:API contract the plugins depend on (assets,
#                           logs, quantities with measures, inventory adjust).
#   - ui.assetlink.spec.js: Asset Link SPA boots and authenticates via farmOS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start farmOS + database
        run: docker compose up -d

      - name: Install + configure farmOS (idempotent)
        run: ./scripts/setup-farmos.sh

      - name: Wait for farmOS API
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/api || echo 000)
            if [ "$code" = "200" ]; then echo "farmOS API is up"; break; fi
            echo "waiting for farmOS ($code)..."; sleep 5
          done

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
